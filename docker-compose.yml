version: '3.8'

services:
  habit-tracker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-habit-tracker-saas
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - DATABASE_URL=file:./dev.db
      - JWT_SECRET=habit-tracker-production-jwt-secret-replace-me
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - habit_data:/app/backend/prisma

volumes:
  habit_data:
